<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Прокат</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Прокат оборудования</h1>
        <nav id="main-nav">
            <a href="#" onclick="navigate('catalog'); return false;">Каталог</a>
            <a href="#" onclick="navigate('profile'); return false;" id="link-profile" style="display:none;">Личный кабинет</a>
            <a href="#" onclick="navigate('manager'); return false;" id="link-manager" style="display:none;">Заказы</a>
            <a href="#" onclick="navigate('admin'); return false;" id="link-admin" style="display:none;">Админ-панель</a>
            <a href="#" onclick="navigate('auth'); return false;" id="link-login">Войти</a>
            <a href="#" onclick="logout(); return false;" id="link-logout" style="display:none;">Выйти</a>
            <span id="user-name-display"></span>
        </nav>
    </header>

    <main id="app"></main>

    <div id="modal-booking" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);">
        <div style="background:white; margin:100px auto; padding:20px; width:300px; border:1px solid black;">
            <h2>Бронирование</h2>
            <p id="modal-item-name"></p>
            <label>Дата начала: <input type="date" id="book-start" oninput="calculatePrice()"></label><br><br>
            <label>Дата окончания: <input type="date" id="book-end" oninput="calculatePrice()"></label><br><br>
            <p>Итого: <span id="book-total">0</span> руб.</p>
            <button onclick="confirmBooking()">Забронировать</button>
            <button onclick="closeModal('modal-booking')">Отмена</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/db.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/booking.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/manager.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
